<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Albert — Backend Developer &amp; Cybersecurity Enthusiast</title>
    <meta name="description"
        content="Portfolio of Albert, an aspiring backend developer and cybersecurity enthusiast based in India.">
    <meta name="author" content="Albert">
    <meta name="theme-color" content="#ffffff">

    <link rel="icon" type="image/png" href="Public/Img/Profilepic.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@300;400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="Styles/main.css">
</head>

<body>

    <div class="viewport-frame" aria-hidden="true"></div>

    <div class="page">

        <header class="nav-wrap">
            <nav class="nav" aria-label="Main navigation">
                <a class="brand" href="#home" aria-label="TB, back to top">TB.</a>

                <div class="nav__links">
                    <a class="nav__link is-active" href="#home" aria-current="page">HOME</a>
                    <a class="nav__link" href="https://github.com/burneybuilds" target="_blank" rel="noopener">PROJECT</a>
                    <a class="nav__link" href="mailto:tusharburney@gmail.com">CONTACT ME</a>
                </div>
            </nav>
        </header>

        <main class="hero" id="home">

            <div class="hero__left">
                <div class="badge-stage">
                    <div class="badge">
                        <div class="badge__clip" aria-hidden="true">
                            <span class="badge__ring"></span>
                            <span class="badge__strap"></span>
                            <span class="badge__holder"><span class="badge__slot"></span></span>
                        </div>

                        <div class="id-card">
                            <div class="id-card__photo">
                                <img class="id-card__avatar" src="imgs/me.png" width="1181"
                                    height="1332" alt="Cartoon avatar of Albert Burney">
                            </div>

                            <div class="id-card__name">
                                <span>Albert</span>
                                <span>Burney</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hero__right">
                <h1 class="greeting">Hii......</h1>

                <p class="intro">I'm Albert, an aspiring backend developer and cybersecurity enthusiast based in
                    India.</p>

                <section class="languages" aria-labelledby="languages-title">
                    <h2 class="languages__title" id="languages-title">LANGUAGES</h2>

                    <div class="languages__grid">
                        <div class="language-box">
                            <img class="language-box__icon" src="imgs/c-program-icon.svg"
                                alt="C programming language logo">
                        </div>
                        <div class="language-box">
                            <img class="language-box__icon" src="imgs/language-python-svgrepo-com.svg"
                                alt="Python programming language logo">
                        </div>
                        <div class="language-box">
                            <img class="language-box__icon" src="imgs/typescript-svgrepo-com.svg"
                                alt="TypeScript programming language logo">
                        </div>
                    </div>
                </section>
            </div>

        </main>

    </div>

    <script src="Scripts/main.js"></script>
</body>

</html>
